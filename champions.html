<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noai, noimageai">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="tdm-reservation" content="1">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스피릿 최강자들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0d0b18; --bg2:#161226; --panel:#1c1730; --panel2:#241d3d;
  --gold:#ffd166; --gold-dim:#a8863f;
  --fire:#ff6b4a; --water:#3ac6ff; --forest:#7ee081; --rock:#c9a15a; --sky:#a0e9ff; --shadow:#b18aff;
  --text:#f1eefb; --text-dim:#9b93b8; --danger:#ff5c7a; --good:#57e39a;
  --border:#332a55;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overscroll-behavior:none;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:
  radial-gradient(circle at 20% 0%, #241a44 0%, transparent 55%),
  radial-gradient(circle at 90% 10%, #1a2e46 0%, transparent 50%),
  linear-gradient(180deg, var(--bg) 0%, #0a0813 100%);
  overflow:hidden;}
.font-display{font-family:'Cinzel',serif;}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 90px 14px;display:none;}
.screen.active{display:block;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,#1a1530,#120e22);border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar .title{font-family:'Cinzel',serif;font-weight:700;font-size:17px;letter-spacing:0.5px;color:var(--gold);}
.res{display:flex;gap:10px;font-size:12px;}
.res span{background:#00000055;border:1px solid var(--border);border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:4px;}
.res .icon{font-size:13px;}
.navbar{display:flex;background:#120e22;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.navbtn{flex:1;text-align:center;padding:9px 2px 7px;font-size:10px;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:2px;}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--gold);}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card h3{margin:0 0 8px;font-family:'Cinzel',serif;font-size:14px;color:var(--gold);letter-spacing:0.4px;}
.btn{display:inline-block;text-align:center;background:linear-gradient(180deg,#3a2f66,#241c40);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;}
.btn:active{transform:scale(0.97);}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a638);color:#291a00;border:1px solid #a8863f;}
.btn.danger{background:linear-gradient(180deg,#ff7b7b,#c23f4f);color:#fff;border:1px solid #7a2530;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
.btn.block{display:block;width:100%;}
.btn.small{padding:7px 10px;font-size:12px;border-radius:9px;}
.btn:disabled{opacity:0.4;}
.row{display:flex;gap:8px;}
.row.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mono{font-family:'Cinzel',serif;}
.pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:10px;font-weight:700;border:1px solid var(--border);}
.hr{height:1px;background:var(--border);margin:10px 0;}
.elbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;border-radius:20px;padding:3px 8px;}
.monchip{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:8px;text-align:center;position:relative;}
.monchip .emoji{font-size:30px;line-height:1;}
.monchip .name{font-size:11px;font-weight:700;margin-top:4px;}
.monchip .lv{font-size:9px;color:var(--text-dim);}
.monchip.selected{border-color:var(--gold);box-shadow:0 0 0 2px #ffd16655;}
.monchip .star{position:absolute;top:3px;right:4px;font-size:9px;}
.progress{height:9px;border-radius:6px;background:#00000066;overflow:hidden;border:1px solid #00000088;}
.progress .fill{height:100%;border-radius:6px;transition:width .4s ease;}
.hpbar .fill{background:linear-gradient(90deg,#57e39a,#2fbd77);}
.hpbar .fill.mid{background:linear-gradient(90deg,#ffd166,#e0a638);}
.hpbar .fill.low{background:linear-gradient(90deg,#ff5c7a,#c23f4f);}
.center{text-align:center;}
.subtle{color:var(--text-dim);font-size:12px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1c1730ee;border:1px solid var(--gold-dim);color:var(--gold);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s, top .25s;box-shadow:0 6px 20px #000a;}
.toast.show{opacity:1;top:26px;}
/* 모드별 스타일 최적화 (PC vs 모바일) */
body.ui-pc #app{max-width:960px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,0.8);border-left:1px solid var(--border);border-right:1px solid var(--border);}
body.ui-pc .battlewrap{min-height:500px;}
body.ui-pc .grid3{grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));}
body.ui-mobile .pc-only{display:none!important;}
body.ui-pc .mobile-only{display:none!important;}

/* 센스리더 및 스크린리더 전용 텍스트 숨김 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
/* 키보드 및 센스리더 초점 가시성 스타일 */
:focus-visible{outline:3px solid var(--gold)!important;outline-offset:2px!important;box-shadow:0 0 10px rgba(255,209,102,0.8)!important;}
button{font-family:inherit;}

input[type=text]{width:100%;background:#100c1e;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font-size:15px;text-align:center;letter-spacing:1px;}
.battlewrap{position:relative;height:calc(100vh - 172px);min-height:420px;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%, #2a2350, #0d0b18 70%);border:1px solid var(--border);margin-bottom:10px;}
.arena{position:relative;height:100%;padding:14px;display:flex;flex-direction:column;justify-content:space-between;}
.fighter{display:flex;align-items:center;gap:10px;background:#00000055;border:1px solid var(--border);border-radius:14px;padding:8px 10px;}
.fighter.enemy{align-self:flex-start;}
.fighter.player{align-self:flex-end;flex-direction:row-reverse;}
.fighter .portrait{font-size:38px;filter:drop-shadow(0 2px 6px #000a);transition:transform .15s;}
.fighter .info{min-width:120px;}
.fighter .info .nm{font-size:12px;font-weight:700;}
.fighter .info .hp{font-size:9px;color:var(--text-dim);margin-top:2px;}
.shake{animation:shakeanim .3s;}
@keyframes shakeanim{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hitflash{animation:hitflash .3s;}
@keyframes hitflash{0%{filter:brightness(3) saturate(0)}100%{filter:brightness(1)}}
.megaglow{animation:megaglow 1.2s ease-in-out infinite alternate;}
@keyframes megaglow{from{filter:drop-shadow(0 0 6px #ffd166)}to{filter:drop-shadow(0 0 22px #ffd166) drop-shadow(0 0 10px #ff6b4a)}}
.faint{animation:faintanim .5s forwards;}
@keyframes faintanim{to{opacity:0;transform:translateY(20px) scale(0.7)}}
.log{background:#00000066;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;min-height:34px;color:var(--text-dim);line-height:1.5;}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.movebtn{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;font-size:11.5px;font-weight:700;}
.movebtn .pw{font-size:9px;color:var(--text-dim);font-weight:400;margin-top:2px;}
.movebtn:active{transform:scale(0.96);}
.tierrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
.tierrow:last-child{border-bottom:none;}
.tiericon{font-size:20px;width:28px;text-align:center;}
.modal-bg{position:fixed;inset:0;background:#000000cc;z-index:900;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:18px;padding:20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;}
.gachaflash{position:fixed;inset:0;background:#fff;z-index:950;opacity:0;pointer-events:none;}
.gachaflash.go{animation:flashpop .5s;}
@keyframes flashpop{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.rarity-common{color:#9b93b8;}
.rarity-rare{color:#3ac6ff;}
.rarity-epic{color:#b18aff;text-shadow:0 0 8px #b18aff88;}
::-webkit-scrollbar{display:none;}

/* ===== 그래픽 패치 ===== */
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0.5;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 12%, #ffffffcc, transparent 60%),
    radial-gradient(1px 1px at 30% 55%, #ffffff99, transparent 60%),
    radial-gradient(1.5px 1.5px at 55% 20%, #ffffffaa, transparent 60%),
    radial-gradient(1px 1px at 75% 65%, #ffffff77, transparent 60%),
    radial-gradient(1.5px 1.5px at 90% 30%, #ffffffbb, transparent 60%),
    radial-gradient(1px 1px at 15% 80%, #ffffff88, transparent 60%),
    radial-gradient(1.5px 1.5px at 65% 90%, #ffffff99, transparent 60%);
  animation:twinkle 5s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:0.65}}
.topbar, #app > .screen, .navbar{position:relative; z-index:1;}
.topbar{box-shadow:0 1px 0 #ffd16622, 0 8px 20px -10px #000;}
.topbar .title{text-shadow:0 0 14px #ffd16655;}
.card{position:relative; overflow:hidden; box-shadow:0 6px 18px -10px #000c;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ffd16688,transparent);}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.monchip .emoji{animation:floaty 3s ease-in-out infinite;}
.monchip{transition:transform .15s;}
.monchip:active{transform:scale(0.95);}
.monchip.rar-common{box-shadow:inset 0 0 0 1px #9b93b855;}
.monchip.rar-rare{box-shadow:inset 0 0 0 1px #3ac6ff55, 0 0 10px -3px #3ac6ff77; border-color:#3ac6ff55;}
.monchip.rar-epic{box-shadow:inset 0 0 0 1px #b18aff77, 0 0 14px -2px #b18affaa; border-color:#b18aff77;}
.monchip.rar-epic .emoji{animation:floaty 3s ease-in-out infinite, epicshimmer 2.2s ease-in-out infinite;}
@keyframes epicshimmer{0%,100%{filter:drop-shadow(0 0 3px #b18aff88)}50%{filter:drop-shadow(0 0 10px #b18affcc)}}
.fighter{position:relative;}
.fighter::after{content:'';position:absolute;left:50%;bottom:-8px;width:64px;height:14px;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(ellipse, var(--el,#8a7bff)55, transparent 72%); filter:blur(1px);}
.fighter.player::after{left:auto; right:50%; transform:translateX(50%);}
.fighter .portrait{animation:floaty 2.4s ease-in-out infinite;}
.fighter .portrait.hitflash{animation:floaty 2.4s ease-in-out infinite, hitflash .3s;}
.fighter .portrait.megaglow{animation:floaty 2.4s ease-in-out infinite, megaglow 1.2s ease-in-out infinite alternate;}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:5;animation:particleburst .6s ease-out forwards;}
@keyframes particleburst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(0.15);opacity:0;}}
.battlewrap{transition:background 1s ease;}
.gachaflash.go{background:radial-gradient(circle, #fff, #ffd166);}
.movebtn{position:relative; overflow:hidden; border-left:3px solid var(--gold-dim);}
.movebtn:active{background:var(--panel);}

/* ===== 전설 등급 / 픽업 / 접근성 포커스 ===== */
.rarity-legend{color:#ffd166;text-shadow:0 0 10px #ffb02e,0 0 18px #ff6b4a88;}
.monchip.rar-legend{border-color:#ffd166;background:linear-gradient(160deg,#3a2a52,#241d3d);box-shadow:inset 0 0 0 1px #ffd166aa,0 0 18px -2px #ffb02ecc;}
.monchip.rar-legend .emoji{animation:floaty 3s ease-in-out infinite, legendglow 1.6s ease-in-out infinite;}
@keyframes legendglow{0%,100%{filter:drop-shadow(0 0 4px #ffd166aa)}50%{filter:drop-shadow(0 0 14px #ffd166) drop-shadow(0 0 8px #ff6b4a)}}
.card.pickup{border-color:#ffd166aa;background:linear-gradient(160deg,#33254d,#1c1730);}
.btn:focus-visible,.navbtn:focus-visible,.movebtn:focus-visible,.monchip:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ===== 근처 기기 대전 ===== */
input[type=text], textarea{-webkit-user-select:text; user-select:text;}
textarea{width:100%;background:#100c1e;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;resize:none;}

/* ===== 다이맥스 / 기믹 장착소 ===== */
.fighter .portrait.dynaglow{animation:dynaglow 1s ease-in-out infinite alternate;transform:scale(1.5);transform-origin:50% 100%;}
@keyframes dynaglow{from{filter:drop-shadow(0 0 6px #ff4d4d)}to{filter:drop-shadow(0 0 22px #ff4d4d) drop-shadow(0 0 10px #ffd166)}}
.gimmick-on{color:#7be0a0;font-size:11px;font-weight:700;}
.fighter .portrait.gmaxglow{animation:gmaxglow 1.1s ease-in-out infinite alternate;transform:scale(1.8);transform-origin:50% 100%;}
@keyframes gmaxglow{from{filter:drop-shadow(0 0 8px #ffd166) drop-shadow(0 0 4px #ff4da6)}to{filter:drop-shadow(0 0 26px #ffd166) drop-shadow(0 0 14px #ff4da6)}}
  .awakenglow{ animation:awakenGlow 1.1s infinite; }
  @keyframes awakenGlow{ 0%,100%{ filter:drop-shadow(0 0 8px #ffd166); transform:scale(1); } 50%{ filter:drop-shadow(0 0 22px #fff3b0); transform:scale(1.07); } }
  .tier-transcend-champions{ color:#ffd166; }
</style>
  <script src="spirit-core.js"></script>
</head>

      <button type="button" class="btn small ghost" onclick="openSettings()" aria-label="환경 설정 열기 (모바일 모드, PC 모드 전환)" style="font-size:11px;padding:4px 8px;cursor:pointer;">⚙️ 설정</button>

    </div>
    </div>
  </div>

  <div id="screen-home" class="screen active"></div>
  <div id="screen-party" class="screen"></div>
  <div id="screen-raid" class="screen"></div>
  <div id="screen-gimmick" class="screen"></div>
  <div id="screen-gacha" class="screen"></div>
  <div id="screen-rank" class="screen"></div>
  <div id="screen-shop" class="screen"></div>
  <div id="screen-friend" class="screen"></div>
  <div id="screen-battle" class="screen"></div>

  <div class="navbar" id="navbar" role="navigation" aria-label="메인 메뉴">
    <div class="navbtn" data-nav="home" role="button" tabindex="0" aria-label="홈 화면으로 이동"><div class="ic" aria-hidden="true">🏠</div>홈</div>
    <div class="navbtn" data-nav="party" role="button" tabindex="0" aria-label="파티 편성 화면으로 이동"><div class="ic" aria-hidden="true">🐾</div>파티</div>
    <div class="navbtn" data-nav="gacha" role="button" tabindex="0" aria-label="소환 화면으로 이동"><div class="ic" aria-hidden="true">🎴</div>소환</div>
    <div class="navbtn" data-nav="rank" role="button" tabindex="0" aria-label="랭크 화면으로 이동"><div class="ic" aria-hidden="true">🏆</div>랭크</div>
    <div class="navbtn" data-nav="shop" role="button" tabindex="0" aria-label="상점 화면으로 이동"><div class="ic" aria-hidden="true">🏪</div>상점</div>
    <div class="navbtn" data-nav="friend" role="button" tabindex="0" aria-label="친구 대전 화면으로 이동"><div class="ic" aria-hidden="true">🤝</div>친구</div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="gachaflash" id="gachaflash"></div>
<div class="modal-bg" id="modalbg"><div class="modal" id="modalbody" role="dialog" aria-modal="true" aria-label="알림 창" tabindex="-1"></div></div>
