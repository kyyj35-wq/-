<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스피릿 최강자들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0d0b18; --bg2:#161226; --panel:#1c1730; --panel2:#241d3d;
  --gold:#ffd166; --gold-dim:#a8863f;
  --fire:#ff6b4a; --water:#3ac6ff; --forest:#7ee081; --rock:#c9a15a; --sky:#a0e9ff; --shadow:#b18aff;
  --text:#f1eefb; --text-dim:#9b93b8; --danger:#ff5c7a; --good:#57e39a;
  --border:#332a55;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overscroll-behavior:none;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:
  radial-gradient(circle at 20% 0%, #241a44 0%, transparent 55%),
  radial-gradient(circle at 90% 10%, #1a2e46 0%, transparent 50%),
  linear-gradient(180deg, var(--bg) 0%, #0a0813 100%);
  overflow:hidden;}
.font-display{font-family:'Cinzel',serif;}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 90px 14px;display:none;}
.screen.active{display:block;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,#1a1530,#120e22);border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar .title{font-family:'Cinzel',serif;font-weight:700;font-size:17px;letter-spacing:0.5px;color:var(--gold);}
.res{display:flex;gap:10px;font-size:12px;}
.res span{background:#00000055;border:1px solid var(--border);border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:4px;}
.res .icon{font-size:13px;}
.navbar{display:flex;background:#120e22;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.navbtn{flex:1;text-align:center;padding:9px 2px 7px;font-size:10px;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:2px;}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--gold);}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card h3{margin:0 0 8px;font-family:'Cinzel',serif;font-size:14px;color:var(--gold);letter-spacing:0.4px;}
.btn{display:inline-block;text-align:center;background:linear-gradient(180deg,#3a2f66,#241c40);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;}
.btn:active{transform:scale(0.97);}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a638);color:#291a00;border:1px solid #a8863f;}
.btn.danger{background:linear-gradient(180deg,#ff7b7b,#c23f4f);color:#fff;border:1px solid #7a2530;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
.btn.block{display:block;width:100%;}
.btn.small{padding:7px 10px;font-size:12px;border-radius:9px;}
.btn:disabled{opacity:0.4;}
.row{display:flex;gap:8px;}
.row.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mono{font-family:'Cinzel',serif;}
.pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:10px;font-weight:700;border:1px solid var(--border);}
.hr{height:1px;background:var(--border);margin:10px 0;}
.elbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;border-radius:20px;padding:3px 8px;}
.monchip{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:8px;text-align:center;position:relative;}
.monchip .emoji{font-size:30px;line-height:1;}
.monchip .name{font-size:11px;font-weight:700;margin-top:4px;}
.monchip .lv{font-size:9px;color:var(--text-dim);}
.monchip.selected{border-color:var(--gold);box-shadow:0 0 0 2px #ffd16655;}
.monchip .star{position:absolute;top:3px;right:4px;font-size:9px;}
.progress{height:9px;border-radius:6px;background:#00000066;overflow:hidden;border:1px solid #00000088;}
.progress .fill{height:100%;border-radius:6px;transition:width .4s ease;}
.hpbar .fill{background:linear-gradient(90deg,#57e39a,#2fbd77);}
.hpbar .fill.mid{background:linear-gradient(90deg,#ffd166,#e0a638);}
.hpbar .fill.low{background:linear-gradient(90deg,#ff5c7a,#c23f4f);}
.center{text-align:center;}
.subtle{color:var(--text-dim);font-size:12px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1c1730ee;border:1px solid var(--gold-dim);color:var(--gold);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s, top .25s;box-shadow:0 6px 20px #000a;}
.toast.show{opacity:1;top:26px;}
input[type=text]{width:100%;background:#100c1e;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font-size:15px;text-align:center;letter-spacing:1px;}
.battlewrap{position:relative;height:calc(100vh - 172px);min-height:420px;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%, #2a2350, #0d0b18 70%);border:1px solid var(--border);margin-bottom:10px;}
.arena{position:relative;height:100%;padding:14px;display:flex;flex-direction:column;justify-content:space-between;}
.fighter{display:flex;align-items:center;gap:10px;background:#00000055;border:1px solid var(--border);border-radius:14px;padding:8px 10px;}
.fighter.enemy{align-self:flex-start;}
.fighter.player{align-self:flex-end;flex-direction:row-reverse;}
.fighter .portrait{font-size:38px;filter:drop-shadow(0 2px 6px #000a);transition:transform .15s;}
.fighter .info{min-width:120px;}
.fighter .info .nm{font-size:12px;font-weight:700;}
.fighter .info .hp{font-size:9px;color:var(--text-dim);margin-top:2px;}
.shake{animation:shakeanim .3s;}
@keyframes shakeanim{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hitflash{animation:hitflash .3s;}
@keyframes hitflash{0%{filter:brightness(3) saturate(0)}100%{filter:brightness(1)}}
.megaglow{animation:megaglow 1.2s ease-in-out infinite alternate;}
@keyframes megaglow{from{filter:drop-shadow(0 0 6px #ffd166)}to{filter:drop-shadow(0 0 22px #ffd166) drop-shadow(0 0 10px #ff6b4a)}}
.faint{animation:faintanim .5s forwards;}
@keyframes faintanim{to{opacity:0;transform:translateY(20px) scale(0.7)}}
.log{background:#00000066;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;min-height:34px;color:var(--text-dim);line-height:1.5;}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.movebtn{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;font-size:11.5px;font-weight:700;}
.movebtn .pw{font-size:9px;color:var(--text-dim);font-weight:400;margin-top:2px;}
.movebtn:active{transform:scale(0.96);}
.tierrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
.tierrow:last-child{border-bottom:none;}
.tiericon{font-size:20px;width:28px;text-align:center;}
.modal-bg{position:fixed;inset:0;background:#000000cc;z-index:900;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:18px;padding:20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;}
.gachaflash{position:fixed;inset:0;background:#fff;z-index:950;opacity:0;pointer-events:none;}
.gachaflash.go{animation:flashpop .5s;}
@keyframes flashpop{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.rarity-common{color:#9b93b8;}
.rarity-rare{color:#3ac6ff;}
.rarity-epic{color:#b18aff;text-shadow:0 0 8px #b18aff88;}
::-webkit-scrollbar{display:none;}

/* ===== 그래픽 패치 ===== */
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0.5;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 12%, #ffffffcc, transparent 60%),
    radial-gradient(1px 1px at 30% 55%, #ffffff99, transparent 60%),
    radial-gradient(1.5px 1.5px at 55% 20%, #ffffffaa, transparent 60%),
    radial-gradient(1px 1px at 75% 65%, #ffffff77, transparent 60%),
    radial-gradient(1.5px 1.5px at 90% 30%, #ffffffbb, transparent 60%),
    radial-gradient(1px 1px at 15% 80%, #ffffff88, transparent 60%),
    radial-gradient(1.5px 1.5px at 65% 90%, #ffffff99, transparent 60%);
  animation:twinkle 5s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:0.65}}
.topbar, #app > .screen, .navbar{position:relative; z-index:1;}
.topbar{box-shadow:0 1px 0 #ffd16622, 0 8px 20px -10px #000;}
.topbar .title{text-shadow:0 0 14px #ffd16655;}
.card{position:relative; overflow:hidden; box-shadow:0 6px 18px -10px #000c;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ffd16688,transparent);}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.monchip .emoji{animation:floaty 3s ease-in-out infinite;}
.monchip{transition:transform .15s;}
.monchip:active{transform:scale(0.95);}
.monchip.rar-common{box-shadow:inset 0 0 0 1px #9b93b855;}
.monchip.rar-rare{box-shadow:inset 0 0 0 1px #3ac6ff55, 0 0 10px -3px #3ac6ff77; border-color:#3ac6ff55;}
.monchip.rar-epic{box-shadow:inset 0 0 0 1px #b18aff77, 0 0 14px -2px #b18affaa; border-color:#b18aff77;}
.monchip.rar-epic .emoji{animation:floaty 3s ease-in-out infinite, epicshimmer 2.2s ease-in-out infinite;}
@keyframes epicshimmer{0%,100%{filter:drop-shadow(0 0 3px #b18aff88)}50%{filter:drop-shadow(0 0 10px #b18affcc)}}
.fighter{position:relative;}
.fighter::after{content:'';position:absolute;left:50%;bottom:-8px;width:64px;height:14px;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(ellipse, var(--el,#8a7bff)55, transparent 72%); filter:blur(1px);}
.fighter.player::after{left:auto; right:50%; transform:translateX(50%);}
.fighter .portrait{animation:floaty 2.4s ease-in-out infinite;}
.fighter .portrait.hitflash{animation:floaty 2.4s ease-in-out infinite, hitflash .3s;}
.fighter .portrait.megaglow{animation:floaty 2.4s ease-in-out infinite, megaglow 1.2s ease-in-out infinite alternate;}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:5;animation:particleburst .6s ease-out forwards;}
@keyframes particleburst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(0.15);opacity:0;}}
.battlewrap{transition:background 1s ease;}
.gachaflash.go{background:radial-gradient(circle, #fff, #ffd166);}
.movebtn{position:relative; overflow:hidden; border-left:3px solid var(--gold-dim);}
.movebtn:active{background:var(--panel);}

/* ===== 전설 등급 / 픽업 / 접근성 포커스 ===== */
.rarity-legend{color:#ffd166;text-shadow:0 0 10px #ffb02e,0 0 18px #ff6b4a88;}
.monchip.rar-legend{border-color:#ffd166;background:linear-gradient(160deg,#3a2a52,#241d3d);box-shadow:inset 0 0 0 1px #ffd166aa,0 0 18px -2px #ffb02ecc;}
.monchip.rar-legend .emoji{animation:floaty 3s ease-in-out infinite, legendglow 1.6s ease-in-out infinite;}
@keyframes legendglow{0%,100%{filter:drop-shadow(0 0 4px #ffd166aa)}50%{filter:drop-shadow(0 0 14px #ffd166) drop-shadow(0 0 8px #ff6b4a)}}
.card.pickup{border-color:#ffd166aa;background:linear-gradient(160deg,#33254d,#1c1730);}
.btn:focus-visible,.navbtn:focus-visible,.movebtn:focus-visible,.monchip:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ===== 근처 기기 대전 ===== */
input[type=text], textarea{-webkit-user-select:text; user-select:text;}
textarea{width:100%;background:#100c1e;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;resize:none;}

/* ===== 다이맥스 / 기믹 장착소 ===== */
.fighter .portrait.dynaglow{animation:dynaglow 1s ease-in-out infinite alternate;transform:scale(1.5);transform-origin:50% 100%;}
@keyframes dynaglow{from{filter:drop-shadow(0 0 6px #ff4d4d)}to{filter:drop-shadow(0 0 22px #ff4d4d) drop-shadow(0 0 10px #ffd166)}}
.gimmick-on{color:#7be0a0;font-size:11px;font-weight:700;}
.fighter .portrait.gmaxglow{animation:gmaxglow 1.1s ease-in-out infinite alternate;transform:scale(1.8);transform-origin:50% 100%;}
@keyframes gmaxglow{from{filter:drop-shadow(0 0 8px #ffd166) drop-shadow(0 0 4px #ff4da6)}to{filter:drop-shadow(0 0 26px #ffd166) drop-shadow(0 0 14px #ff4da6)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">✦ 스피릿 최강자들</div>
    <div class="res">
      <span id="res-gem-wrap" role="img" aria-label="젬 0개"><span class="icon" aria-hidden="true">💎</span><span id="res-gem" aria-hidden="true">0</span></span>
      <span id="res-shard-wrap" role="img" aria-label="강화조각 0개"><span class="icon" aria-hidden="true">🔶</span><span id="res-shard" aria-hidden="true">0</span></span>
      <span id="save-ind" role="status" aria-label="자동 저장 켜짐" style="font-size:11px;opacity:.5;">💾</span>
    </div>
  </div>

  <div id="screen-home" class="screen active"></div>
  <div id="screen-party" class="screen"></div>
  <div id="screen-raid" class="screen"></div>
  <div id="screen-gimmick" class="screen"></div>
  <div id="screen-gacha" class="screen"></div>
  <div id="screen-rank" class="screen"></div>
  <div id="screen-shop" class="screen"></div>
  <div id="screen-friend" class="screen"></div>
  <div id="screen-battle" class="screen"></div>

  <div class="navbar" id="navbar" role="navigation" aria-label="메인 메뉴">
    <div class="navbtn" data-nav="home" role="button" tabindex="0" aria-label="홈 화면으로 이동"><div class="ic" aria-hidden="true">🏠</div>홈</div>
    <div class="navbtn" data-nav="party" role="button" tabindex="0" aria-label="파티 편성 화면으로 이동"><div class="ic" aria-hidden="true">🐾</div>파티</div>
    <div class="navbtn" data-nav="gacha" role="button" tabindex="0" aria-label="소환 화면으로 이동"><div class="ic" aria-hidden="true">🎴</div>소환</div>
    <div class="navbtn" data-nav="rank" role="button" tabindex="0" aria-label="랭크 화면으로 이동"><div class="ic" aria-hidden="true">🏆</div>랭크</div>
    <div class="navbtn" data-nav="shop" role="button" tabindex="0" aria-label="상점 화면으로 이동"><div class="ic" aria-hidden="true">🏪</div>상점</div>
    <div class="navbtn" data-nav="friend" role="button" tabindex="0" aria-label="친구 대전 화면으로 이동"><div class="ic" aria-hidden="true">🤝</div>친구</div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="gachaflash" id="gachaflash"></div>
<div class="modal-bg" id="modalbg"><div class="modal" id="modalbody" role="dialog" aria-modal="true" aria-label="알림 창" tabindex="-1"></div></div>

<script>
/* ============ 저장소 폴백 ============ */
if(!window.storage){
  window.storage = {
    async get(k){ const v = localStorage.getItem(k); if(v===null) throw new Error('not found'); return {key:k, value:v}; },
    async set(k,v){ localStorage.setItem(k,v); return {key:k, value:v}; }
  };
}

/* ============ 데이터 정의 ============ */
const ELEMENTS = {
  fire:{name:'파이어', color:'var(--fire)', emoji:'🔥'},
  water:{name:'워터', color:'var(--water)', emoji:'💧'},
  forest:{name:'포레스트', color:'var(--forest)', emoji:'🌿'},
  rock:{name:'락', color:'var(--rock)', emoji:'🪨'},
  sky:{name:'스카이', color:'var(--sky)', emoji:'🌪️'},
  shadow:{name:'섀도우', color:'var(--shadow)', emoji:'🌑'},
};
// 상성표 (공격 기술 속성 -> {맞는 속성: 배율}) — 불·물·풀·바위·비행·고스트 상성 기준
// 파이어=불, 워터=물, 포레스트=풀, 락=바위, 스카이=비행, 섀도우=고스트, 무속성=노말
const EFFECT = {
  fire:   {fire:0.5, water:0.5, forest:2, rock:0.5},
  water:  {fire:2, water:0.5, forest:0.5, rock:2},
  forest: {fire:0.5, water:2, forest:0.5, rock:2, sky:0.5},
  rock:   {fire:2, sky:2},
  sky:    {forest:2, rock:0.5},
  shadow: {shadow:2},
  neutral:{rock:0.5, shadow:0},
};
function typeMult(moveType, defElement){
  const row = EFFECT[moveType];
  return (row && row[defElement]!==undefined) ? row[defElement] : 1;
}
function effText(x){ return x===0 ? ' (효과가 없는 것 같다...)' : (x>1 ? ' (효과가 굉장했다!)' : (x<1 ? ' (효과가 별로였다...)' : '')); }
function effBadge(m){
  if(m.power===undefined) return '';
  const x = typeMult(m.type, activeE().sp.element);
  return x>1 ? ' · <b style="color:#7be0a0">효과 굉장 ×'+x+'</b>' : (x===0 ? ' · <b style="color:#ff6b6b">효과 없음</b>' : (x<1 ? ' · <b style="color:#ffb347">별로 ×½</b>' : ''));
}
function effPlain(m){
  if(m.power===undefined) return '';
  const x = typeMult(m.type, activeE().sp.element);
  return x>1 ? ', 상대에게 효과가 굉장함' : (x===0 ? ', 상대에게 효과가 없음' : (x<1 ? ', 상대에게 효과가 별로임' : ''));
}
function openTypeChart(){
  const els = Object.keys(ELEMENTS);
  const cell = (a,d)=>{ const x = typeMult(a,d);
    return x===1 ? '<td style="color:#555;">·</td>' : (x>1 ? '<td style="color:#7be0a0;font-weight:700;">×2</td>' : (x===0 ? '<td style="color:#ff6b6b;font-weight:700;">0</td>' : '<td style="color:#ffb347;font-weight:700;">×½</td>')); };
  const head = '<tr><th style="font-size:10px;">공격＼방어</th>'+els.map(e=>`<th>${ELEMENTS[e].emoji}</th>`).join('')+'</tr>';
  const rows = ['neutral'].concat(els).map(a=>`<tr><th style="text-align:left;white-space:nowrap;">${a==='neutral'?'⚪ 무속성':ELEMENTS[a].emoji+' '+ELEMENTS[a].name}</th>${els.map(d=>cell(a,d)).join('')}</tr>`).join('');
  showModal(`<div class="center"><h3>📊 속성 상성표</h3>
    <div class="subtle" style="margin-bottom:8px;">세로 = 쓰는 기술의 속성, 가로 = 맞는 스피릿몬의 속성</div>
    <table style="width:100%;border-collapse:collapse;text-align:center;font-size:13px;line-height:1.9;">${head}${rows}</table>
    <div class="subtle" style="margin-top:8px;">×2 굉장함 · ×½ 별로 · 0 효과 없음 · ·는 보통</div>
    <div style="height:10px;"></div><div class="btn gold block" onclick="closeModal()" aria-label="닫기">닫기</div></div>`);
}
const FLAVOR = {
  fire:{basic:'불꽃발톱', ult:'인페르노버스트', emoji:['🦎','🐉','🐲']},
  water:{basic:'물대포', ult:'타이달스매시', emoji:['🐠','🐡','🐋']},
  forest:{basic:'덩굴채찍', ult:'와일드그로스', emoji:['🌱','🐺','🦁']},

const SAVE_KEY = 'spiritmon-save', SAVE_BAK = 'spiritmon-save-bak', SAVE_BAD = 'spiritmon-save-corrupt';
let lastStableJson = '', lastSavedAt = 0, lastBackupAt = 0, saveIndTimer = null;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function stableJson(){ return JSON.stringify(Object.assign({}, STATE, {savedAt:0})); }
function snapshotJson(){ STATE.savedAt = Date.now(); return JSON.stringify(STATE); }
function validSave(o){ return !!(o && typeof o==='object' && Array.isArray(o.owned) && Array.isArray(o.party)); }
function parseSave(txt){ try{ const o = JSON.parse(txt); return validSave(o) ? o : null; }catch(e){ return null; } }
function updateSaveIndicator(){
  const el = document.getElementById('save-ind'); if(!el) return;
  const d = new Date(lastSavedAt);
  el.textContent = '💾✓'; el.style.opacity = '1';
  el.setAttribute('aria-label', '자동 저장됨, '+String(d.getHours()).padStart(2,'0')+'시 '+String(d.getMinutes()).padStart(2,'0')+'분');
  clearTimeout(saveIndTimer);
  saveIndTimer = setTimeout(()=>{ el.textContent = '💾'; el.style.opacity = '.5'; }, 1800);
}
async function saveState(){
  const json = snapshotJson();
  let ok = false;
  // 1) 동기 저장(기기 저장소) — 앱을 닫아도 바로 남아요
  const prev = lsGet(SAVE_KEY);
  if(lsSet(SAVE_KEY, json)){
    ok = true;
    // 2) 백업: 정상이던 이전 저장을 1분에 한 번씩 보관 (파일이 깨져도 복구 가능)
    if(prev && prev!==json && parseSave(prev) && Date.now()-lastBackupAt>60000){ lsSet(SAVE_BAK, prev); lastBackupAt = Date.now(); }
  }
  // 3) 앱 저장소(window.storage)가 있으면 거기에도
  try{ if(window.storage && window.storage.set){ await window.storage.set(SAVE_KEY, json, false); ok = true; } }
  catch(e){ console.warn('save failed', e); }
  if(ok){ lastStableJson = stableJson(); lastSavedAt = Date.now(); updateSaveIndicator(); }
}
function saveSync(){   // 화면을 떠날 때(pagehide 등)에는 동기 저장만 가능
  const json = snapshotJson();
  lsSet(SAVE_KEY, json);
  try{ if(window.storage && window.storage.set) window.storage.set(SAVE_KEY, json, false); }catch(e){}
}
async function loadState(){
  const cands = [];
  try{ if(window.storage && window.storage.get){ const r = await window.storage.get(SAVE_KEY, false); if(r && r.value) cands.push({src:'main', txt:r.value}); } }catch(e){}
  const ls = lsGet(SAVE_KEY); if(ls) cands.push({src:'main', txt:ls});
  const bak = lsGet(SAVE_BAK); if(bak) cands.push({src:'backup', txt:bak});
  const good = cands.map(c=>({src:c.src, o:parseSave(c.txt), txt:c.txt})).filter(c=>c.o);
  if(good.length){
    // 가장 최근에 저장된 정상 파일을 사용 (메인이 깨졌으면 백업)
    good.sort((x,y)=>(y.o.savedAt||0)-(x.o.savedAt||0));
    STATE = Object.assign(defaultState(), good[0].o);
    if(good[0].src==='backup' && cands.some(c=>c.src==='main')){
      setTimeout(()=>toast('저장 파일이 손상돼 백업에서 복구했어요'), 600);
      const badMain = cands.find(c=>c.src==='main'); if(badMain) lsSet(SAVE_BAD, badMain.txt);
    }
  }else if(cands.length){
    lsSet(SAVE_BAD, cands[0].txt);   // 못 읽는 파일은 지우지 않고 따로 보관
    setTimeout(()=>toast('저장 파일을 읽지 못해 새로 시작해요 (원본은 보관됨)'), 600);
  }
  lastStableJson = stableJson();
}
function startAutosave(){
  setInterval(()=>{ if(stableJson()!==lastStableJson) saveState(); }, 10000);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveSync(); });
  window.addEventListener('pagehide', saveSync);
  window.addEventListener('beforeunload', saveSync);
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

  const boostMul = 1 + Math.min(inst.boost||0, MAX_BOOST)*BOOST_PER + (inst.mulBonus||0); // 강화(+적 티어 보너스)

}

let actx=null, bgmNodes=[], bgmTimer=null, bgmStep=0;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function playTone(freq, dur, type='sine', vol=0.12, delay=0){
  const ctx = ensureAudio(); if(!ctx) return;
  const t0 = ctx.currentTime+delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.05);
}

const BGM_SCALE = [261.6,293.7,329.6,392.0,440.0,523.3,587.3,659.3]; // C major pentatonic-ish

/* --- 드럼 소리 (킥 / 노이즈 스네어·하이햇) --- */
let noiseBuf = null;
function kick(vol=0.1){
  const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(40, t+0.12);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.16);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+0.2);
}
function noise(dur, vol, hp=3000){
  const ctx = ensureAudio(); if(!ctx) return;
  if(!noiseBuf){
    noiseBuf = ctx.createBuffer(1, 22050, 22050);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<22050;i++) d[i] = Math.random()*2-1;
  }
  const t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t+dur+0.02);
}

  shop:{ ms:250, tick(n){

let bgmTheme = 'home';
function bgmTick(){
  if(!STATE.musicOn) return;
  BGM_THEMES[bgmTheme].tick(bgmStep);
  bgmStep++;
}
function startBgm(){
  if(bgmTimer) return;
  ensureAudio();
  bgmTimer = setInterval(bgmTick, BGM_THEMES[bgmTheme].ms);
}
function stopBgm(){ clearInterval(bgmTimer); bgmTimer=null; }
function setBgmTheme(name){
  if(name===bgmTheme) return;
  bgmTheme = name; bgmStep = 0;
  if(bgmTimer){ stopBgm(); startBgm(); }
}
let CUR_SCREEN = 'home';
function applyBgmTheme(){
  let th = 'home';
  const raidBattle = (typeof BATTLE!=='undefined' && BATTLE && BATTLE.mode==='raid');
  if(CUR_SCREEN==='battle') th = raidBattle ? 'boss' : 'battle';
  else if(CUR_SCREEN==='friend') th = (typeof FRIEND!=='undefined' && FRIEND && FRIEND.status==='battle') ? 'duel' : 'lobby';
  else if(BGM_THEMES[CUR_SCREEN]) th = CUR_SCREEN;   // shop / party / gacha / rank / raid / gimmick
  setBgmTheme(th);
}
function toggleMusic(){
  STATE.musicOn = !STATE.musicOn;
  if(STATE.musicOn) startBgm(); else stopBgm();
  saveState(); renderHome();
}

function redeemCode(){
  const input = document.getElementById('code-input');
  const code = (input.value||'').replace(/\s+/g,'').toUpperCase();
  if(!code) return;
  if(STATE.redeemedCodes.includes(code)){
    toast('이미 사용한 코드예요');
    return;
  }
  const reward = CODES[code];
  if(!reward){
    toast('존재하지 않는 코드예요');
    return;
  }
  STATE.redeemedCodes.push(code);
  let msgs = [reward.msg];
  if(reward.gems){ STATE.gems += reward.gems; msgs.push('젬 +'+reward.gems); }
  if(reward.shards){ STATE.shards += reward.shards; msgs.push('강화조각 +'+reward.shards); }
  if(reward.tickets){ STATE.tickets += reward.tickets; msgs.push('소환권 +'+reward.tickets); }
  if(reward.megastone){ STATE.megastones += reward.megastone; msgs.push('메가스톤 +'+reward.megastone); }
  sfxGacha();
  saveState();
  input.value='';
  showModal(`<div class="center"><div style="font-size:40px;">📮</div>
    <h3 style="margin-top:10px;">코드 보상 획득!</h3>
    <div class="subtle">${msgs.join(' · ')}</div>
    <div style="height:12px;"></div>
    <div class="btn gold block" onclick="closeModal()">확인</div></div>`);
  renderHome();
}

/* ============ 강화 시스템 ============ */
function enhanceCost(b){ return 10 + b*5; }
function openEnhance(uid){
  const inst = instById(uid); if(!inst) return;
  const sp = speciesById(inst.speciesId);
  const b = inst.boost||0, maxed = b>=MAX_BOOST;
  const cur = effectiveStats(inst, false);
  const nxt = maxed ? cur : effectiveStats(Object.assign({}, inst, {boost:b+1}), false);
  const cost = enhanceCost(b);
  const can = !maxed && STATE.shards>=cost;
  const row = (nm,k)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>${nm}</span><span>${cur[k]}${maxed?'':` → <b style="color:var(--gold)">${nxt[k]}</b>`}</span></div>`;
  showModal(`<div class="center">
    <div style="font-size:44px;" aria-hidden="true">${sp.emoji}</div>
    <h3>${sp.name} <span style="color:var(--gold)">+${b}</span></h3>
    <div class="progress" aria-hidden="true" style="margin:8px 0;"><div class="fill" style="width:${b/MAX_BOOST*100}%"></div></div>
    <div class="subtle">강화 ${b} / ${MAX_BOOST}단계 · 단계마다 모든 능력치 +5%</div>
    <div style="text-align:left;margin:10px 4px;">${row('체력','hp')}${row('공격','atk')}${row('방어','def')}${row('속도','spd')}</div>
    ${maxed ? '<div class="subtle">최대 강화 달성! 🎉</div>' : `<div class="subtle">필요 🔶 ${cost} · 보유 🔶 ${STATE.shards}</div>`}
    ${(!maxed && !can) ? '<div class="subtle" style="color:#ff6b6b;">강화조각이 부족해요. 상점에서 젬으로 교환하거나 중복 소환으로 모아요.</div>' : ''}
    <div class="grid2" style="margin-top:10px;">
      <div class="btn gold block" style="${can?'':'opacity:.45;'}" onclick="doEnhance('${uid}',false)" aria-label="${sp.name} 1단계 강화, 강화조각 ${cost}개 필요${can?'':', 지금은 부족'}">⚡ 강화 (🔶${cost})</div>
      <div class="btn block" style="${can?'':'opacity:.45;'}" onclick="doEnhance('${uid}',true)" aria-label="${sp.name} 가능한 만큼 연속 강화">최대한 강화</div>
    </div>
    <div class="btn ghost block" style="margin-top:8px;" onclick="closeModal()" aria-label="닫기">닫기</div></div>`);
}
function doEnhance(uid, many){
  const inst = instById(uid); if(!inst) return;
  if((inst.boost||0)>=MAX_BOOST){ toast('이미 최대 강화예요'); return; }
  let n = 0, spent = 0;
  while((inst.boost||0)<MAX_BOOST){
    const c = enhanceCost(inst.boost||0);
    if(STATE.shards<c) break;
    STATE.shards -= c; spent += c; inst.boost = (inst.boost||0)+1; n++;
    if(!many) break;
  }
  if(n===0){ toast('강화조각이 부족해요'); return; }
  sfxGacha(); saveState(); refreshRes();
  toast('⚡ +'+inst.boost+' 강화 완료! (조각 -'+spent+')');
  renderParty(); openEnhance(uid);
}

function rollRarity(){
  const r = Math.random();
  if(r<0.6) return 0; // stage1 common
  if(r<0.9) return 1; // stage2 rare
  return 2; // stage3 epic
}
function grantSpecies(spId){
  const sp = speciesById(spId);
  const dup = STATE.owned.find(m=>m.speciesId===spId);
  if(dup){
    const shardGain = sp.rarity==='legend' ? 100 : 10 + (sp.stage-1)*10;
    STATE.shards += shardGain;
    const leveled = (dup.boost||0) < MAX_BOOST;       // 중복이 나올 때마다 강화 +1
    if(leveled) dup.boost = (dup.boost||0) + 1;
    return {sp, dup:true, shardGain, leveled, boost:dup.boost||0};
  }
  const inst = makeInstance(spId);
  STATE.owned.push(inst);
  return {sp, dup:false, inst};
}
function pullOne(){
  if(Math.random()<NORMAL_LEGEND.rate) return grantSpecies(NORMAL_LEGEND.id);
  const elKeys = Object.keys(LINES);
  const el = elKeys[Math.floor(Math.random()*elKeys.length)];
  const stage = rollRarity();
  const pool = SPECIES.filter(s=>s.element===el && s.stage===stage+1 && !s.pickupOnly && !s.raidOnly);
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return grantSpecies(pick.id);
}
function pullPickup(){
  STATE.pickupPity = (STATE.pickupPity||0) + 1;
  if(STATE.pickupPity>=PICKUP.pity || Math.random()<PICKUP.rate){
    STATE.pickupPity = 0;
    return grantSpecies(pickupTargetId());
  }
  return pullOne();
}
function doPickup(count){
  const cost = count===1?150:1400;
  if(STATE.gems<cost){ toast('젬이 부족해요'); return; }
  STATE.gems -= cost;
  runGachaResults(count, true);
}
function doGacha(count){
  const cost = count===1?150:1400;
  if(STATE.gems<cost){ toast('젬이 부족해요'); return; }
  STATE.gems -= cost;
  runGachaResults(count);
}
function doGachaTicket(){
  if(STATE.tickets<=0) return;
  STATE.tickets -= 1;
  runGachaResults(1);
}
function runGachaResults(count, pickup){
  sfxGacha();
  const flash = document.getElementById('gachaflash');
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  const results = [];
  for(let i=0;i<count;i++) results.push(pickup ? pullPickup() : pullOne());
  if(results.some(r=>r.sp.rarity==='legend')) setTimeout(sfxMega, 250);
  saveState();
  const rows = results.map(r=>{
    const rc = RARITY_COLOR[r.sp.rarity];
    return `<div class="row" style="align-items:center;padding:8px 4px;border-bottom:1px solid var(--border);">
      <div class="monchip rar-${r.sp.rarity}" style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;"><div class="emoji" style="font-size:26px;">${r.sp.emoji}</div></div>
      <div style="flex:1;padding-left:10px;">
        <div style="font-weight:700;">${r.sp.name} <span class="${rc}">[${RARITY_LABEL[r.sp.rarity]}]</span></div>
        <div class="subtle">${ELEMENTS[r.sp.element].emoji} ${ELEMENTS[r.sp.element].name}${r.dup?' · 중복! '+(r.leveled?'강화 +'+r.boost+' ⬆ ':'최대 강화 ')+'· 조각 +'+r.shardGain:' · 신규 획득!'}</div>
      </div>
    </div>`;
  }).join('');
  setTimeout(()=>{
    showModal(`<div class="center"><div style="font-size:36px;">✨</div><h3>소환 결과</h3></div>${rows}
      <div style="height:10px;"></div><div class="btn gold block" onclick="closeModal()">확인</div>`);
    renderGacha();
  }, 350);
}

let BATTLE = null;
function buildFighter(uid, isEnemy){
  const inst = instById(uid) || uid; // 적은 임시 inst 객체를 바로 넘김
  const sp = speciesById(inst.speciesId);
  const megaEquipped = !isEnemy && !!STATE.equippedMega[inst.uid];
  const stats = effectiveStats(inst, false);
  return {
    uid: inst.uid, sp, baseStats: stats, curHp: stats.hp, maxHp: stats.hp,
    megaEquipped, megaActive: false, megaUsed: false, fainted:false, isEnemy,
    dynaEquipped: !isEnemy && !!(STATE.equippedDyna||{})[inst.uid], dynaActive:false, dynaTurns:0, preMaxHp:0, gmax:false
  };
}
function genEnemyTeam(){
  const tier = tierForLP(STATE.lp);
  const tierIdx = TIERS.findIndex(t=>t.key===tier.key);
  const teamSize = 3;
  const team = [];
  const elKeys = Object.keys(LINES);
  for(let i=0;i<teamSize;i++){
    const el = elKeys[Math.floor(Math.random()*elKeys.length)];
    // 티어가 높을수록 강한(높은 stage) 몬스터 확률 증가
    const stageRoll = Math.random() + tierIdx*0.12;
    const stage = stageRoll>1.15 ? 2 : (stageRoll>0.55 ? 1 : 0);
    const inst = { uid:'e'+i+'_'+Date.now(), speciesId: el+'_'+stage, level:1, boost: 0, mulBonus: tierIdx*0.06 };
    team.push(inst);
  }
  return team;
}
function startRankBattle(){
  if(STATE.party.length===0){ toast('파티를 먼저 편성하세요!'); goScreen('party'); return; }
  const playerTeam = STATE.party.map(uid=>buildFighter(uid, false));
  const enemyInsts = genEnemyTeam();
  const enemyTeam = enemyInsts.map(inst=>buildFighter(inst, true));
  BATTLE = {
    mode:'rank', playerTeam, enemyTeam, pIdx:0, eIdx:0, log:[], finished:false, locked:false

  goScreen('battle');

}

function hpClass(f){ const p=f.curHp/f.maxHp; return p>0.5?'':(p>0.2?'mid':'low'); }

function battleControlsHtml(moves, canMega){
  const typeName = (m)=> m.type==='neutral' ? '무속성' : ELEMENTS[m.type].name;

  }
  // --- 평소 화면 ---
  const canSwitch = BATTLE.playerTeam.some((f,i)=>!f.fainted && i!==BATTLE.pIdx) && !BATTLE.finished;
  return `<div class="moves" id="movesgrid">
      ${moves.map((m,i)=>`<div class="movebtn" onclick="playerMove(${i})" aria-label="${m.name}, 위력 ${m.power||'없음'}, ${typeName(m)} 기술${effPlain(m)}"><div>${m.name}</div><div class="pw">위력 ${m.power||'-'} · ${typeName(m)}${effBadge(m)}</div></div>`).join('')}
    </div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap;">
      ${(()=>{ const pp=activeP(); return (pp.dynaEquipped && !BATTLE.dynaUsed && !pp.megaActive && !BATTLE.finished) ? (GMAX[pp.sp.id] ? '<div class="btn gold block" onclick="triggerDynamax()" aria-label="거다이맥스 발동, 3턴 동안 거대해지고 전용 G맥스 기술을 쓸 수 있어요">🌟 거다이맥스!</div>' : '<div class="btn gold block" onclick="triggerDynamax()" aria-label="다이맥스 발동, 3턴 동안 거대해져 체력이 늘고 기술이 강해져요">🔴 다이맥스!</div>') : ''; })()}
      ${canMega?'<div class="btn gold block" onclick="triggerMega()" aria-label="메가진화 발동">💠 메가진화!</div>':''}
      ${canSwitch?'<div class="btn block" onclick="openSwitch()" aria-label="스피릿몬 교체, 이번 턴을 사용하고 상대가 공격해요">🔄 교체</div>':''}

function openSwitch(){
  if(!BATTLE || BATTLE.finished || BATTLE.locked) return;
  BATTLE.pick = 'free';
  renderBattle('교체할 스피릿몬을 선택하세요');
}
function cancelSwitch(){
  if(!BATTLE) return;
  BATTLE.pick = null;
  renderBattle('');
}
function doSwitch(i){
  if(!BATTLE || BATTLE.finished || !BATTLE.pick) return;
  const nf = BATTLE.playerTeam[i];
  if(!nf || nf.fainted || i===BATTLE.pIdx) return;
  const forced = BATTLE.pick==='forced';
  const old = activeP();
  if(!forced) endDyna(old);   // 교체하면 다이맥스는 끝나요
  BATTLE.pick = null;
  BATTLE.pIdx = i;
  sfxTap();
  if(forced){
    BATTLE.locked = false;
    renderBattle(`${nf.sp.name}을(를) 내보냈다!`);
    return;
  }
  // 자유 교체는 한 턴을 쓴다: 새로 나온 스피릿몬이 상대의 공격을 받아요
  BATTLE.locked = true;
  const intro = `${old.sp.name}, 돌아와! 가라, ${nf.sp.name}!`;
  renderBattle(intro);
  const e = activeE();
  const eMoves = movesForSpecies(e.sp);
  const eMove = eMoves[Math.floor(Math.random()*eMoves.length)];
  setTimeout(()=>{
    if(!BATTLE || BATTLE.finished) return;
    const res = calcDamage(e, nf, eMove);
    const dmg = (res && res.dmg) ? res.dmg : 0;
    const mult = (res && res.mult!==undefined) ? res.mult : 1;
    nf.curHp -= dmg;
    battleFlash('player');
    if(mult>1) sfxSuper(); else if(mult<1) sfxWeak(); else sfxHit();
    const logs = [intro, `${e.sp.name}의 ${eMove.name}! ${nf.sp.name}에게 ${dmg} 피해${effText(mult)}`];
    if(nf.curHp<=0){ nf.curHp = 0; nf.fainted = true; logs.push(`${nf.sp.name} 쓰러짐!`); }
    resolveBattleStep(logs);
  }, 600);
}
function calcDamage(attacker, defender, move){
  if(move.power===undefined) return 0;
  const stats = attacker.megaActive ? effectiveStats(instById(attacker.uid)||{boost:0}, true) : attacker.baseStats;
  const atk = attacker.isEnemy ? attacker.baseStats.atk*(attacker.megaActive?1.4:1) : (attacker.megaActive? Math.round(attacker.baseStats.atk*1.4): attacker.baseStats.atk);
  const def = (defender.megaActive ? Math.round(defender.baseStats.def*1.4) : defender.baseStats.def) * (1-(move.pierce||0));
  const mult = typeMult(move.type, defender.sp.element);
  const variance = 0.85 + Math.random()*0.3;
  let dmg = Math.round((move.power * (atk/Math.max(8,def)) * 0.9) * mult * variance);
  dmg = mult===0 ? 0 : Math.max(3, dmg);
  return {dmg, mult};
}
function battleFlash(side){
  const port = document.getElementById('portrait-'+side);
  if(port){ port.classList.remove('hitflash'); void port.offsetWidth; port.classList.add('hitflash'); }
  const f = document.getElementById('f-'+side);
  if(f){ f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
  spawnParticles(side);
}
function spawnParticles(side){
  const wrap = document.querySelector('.battlewrap');
  const port = document.getElementById('portrait-'+side);
  if(!wrap || !port) return;
  const wr = wrap.getBoundingClientRect(), pr = port.getBoundingClientRect();
  const cx = pr.left + pr.width/2 - wr.left, cy = pr.top + pr.height/2 - wr.top;
  const colors = ['#ffd166','#ffffff','#ff9b6a'];
  for(let i=0;i<7;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const ang = Math.random()*Math.PI*2, dist = 22+Math.random()*26;
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = colors[i%colors.length];
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    wrap.appendChild(p);
    setTimeout(()=>p.remove(), 650);
  }
}
function battleMoves(f){
  const base = movesForSpecies(f.sp);
  if(!f.dynaActive) return base;
  return base.map((m,i)=> (f.gmax && i===base.length-1) ? Object.assign({}, GMAX[f.sp.id].move, {gmax:true}) : maxMove(m));
}
function maxMove(m){
  if(m.power===undefined) return m;
  return Object.assign({}, m, {name:'맥스 '+m.name, power:Math.round(m.power*DYNA_POWER)});
}
function endDyna(f){
  if(!f.dynaActive) return;
  f.dynaActive = false; f.dynaTurns = 0; f.gmax = false;
  f.maxHp = f.preMaxHp || f.maxHp;
  f.curHp = Math.max(1, Math.min(f.maxHp, Math.round(f.curHp/DYNA_HP)));
}
function tickDyna(f, logs){
  if(!f.dynaActive) return;
  if(f.fainted){ f.dynaActive = false; return; }
  f.dynaTurns -= 1;
  if(f.dynaTurns<=0){ endDyna(f); logs.push(`${f.sp.name}의 다이맥스가 끝났다...`); }
  else logs.push(`(다이맥스 ${f.dynaTurns}턴 남음)`);
}
function triggerDynamax(){
  if(!BATTLE || BATTLE.finished || BATTLE.locked || BATTLE.pick) return;
  const p = activeP();
  if(!p.dynaEquipped || BATTLE.dynaUsed || p.megaActive || p.dynaActive) return;
  BATTLE.dynaUsed = true;
  p.dynaActive = true; p.dynaTurns = DYNA_TURNS; p.preMaxHp = p.maxHp;
  p.gmax = !!GMAX[p.sp.id];
  p.maxHp = Math.round(p.maxHp*DYNA_HP); p.curHp = Math.round(p.curHp*DYNA_HP);
  sfxMega();
  if(p.gmax){ setTimeout(sfxGacha, 300); toast('🌟 거다이맥스!'); }
  else toast('🔴 다이맥스!');
  renderBattle(p.gmax
    ? p.sp.name+'이(가) 거다이맥스했다! 전용 기술 '+GMAX[p.sp.id].move.name+'을(를) 쓸 수 있다! ('+DYNA_TURNS+'턴)'
    : p.sp.name+'이(가) 다이맥스했다! 기술이 맥스 기술로 바뀌었다! ('+DYNA_TURNS+'턴)');
}
function triggerMega(){
  const p = activeP();
  if(!p.megaEquipped || p.megaUsed || p.dynaActive) return;
  p.megaActive = true; p.megaUsed = true;
  p.maxHp = effectiveStats(instById(p.uid), true).hp;
  p.curHp = Math.min(p.maxHp, p.curHp + Math.round(p.maxHp*0.15));
  sfxMega();
  toast('💠 메가진화!');
  renderBattle(p.sp.name+'이(가) 메가진화했다!');
}
function playerMove(idx){
  if(BATTLE.locked || BATTLE.finished) return;
  BATTLE.locked = true;
  const p = activeP(), e = activeE();
  const pMove = battleMoves(p)[idx];
  const eMoves = movesForSpecies(e.sp);
  const eMove = eMoves[Math.floor(Math.random()*eMoves.length)];
  const pSpd = p.baseStats.spd*(p.megaActive?1.25:1);
  const eSpd = e.baseStats.spd*(e.megaActive?1.25:1);
  const order = pSpd>=eSpd ? ['p','e'] : ['e','p'];
  let logs = [];
  function doAttack(attSide){
    if(BATTLE.finished) return;
    const att = attSide==='p'?p:e, def = attSide==='p'?e:p;
    if(att.fainted || def.fainted) return;
    const move = attSide==='p'?pMove:eMove;
    const res = calcDamage(att, def, move);
    def.curHp -= res.dmg;
    battleFlash(attSide==='p'?'player':'enemy');
    if(attSide==='p') { def.curHp -= 0; }
    if(res.mult>1) sfxSuper(); else if(res.mult<1) sfxWeak(); else sfxHit();
    logs.push(`${att.sp.name}의 ${move.name}! ${def.sp.name}에게 ${res.dmg} 피해${effText(res.mult)}`);
    if(move.drain && res.dmg>0){
      const heal = Math.round(res.dmg*move.drain);
      att.curHp = Math.min(att.maxHp, att.curHp+heal);
      logs.push(`${att.sp.name}은(는) 체력을 ${heal} 회복했다!`);
    }
    if(def.curHp<=0){ def.curHp=0; def.fainted = true; logs.push(`${def.sp.name} 쓰러짐!`); }
  }
  doAttack(order[0]);
  setTimeout(()=>{
    doAttack(order[1]);
    tickDyna(p, logs);
    resolveBattleStep(logs);
  }, 550);
  renderBattleLogOnly(logs.join(' '));
}
function renderBattleLogOnly(msg){
  const log = document.getElementById('battlelog');
  if(log) log.textContent = msg;
  // 즉시 HP 바 갱신
  updateBars();
}
function updateBars(){
  const p = activeP(), e = activeE();
  const pf = document.querySelector('#f-player .fill');
  const ef = document.querySelector('#f-enemy .fill');
  if(pf){ pf.style.width = Math.max(0,p.curHp/p.maxHp*100)+'%'; pf.className='fill '+hpClass(p); }
  if(ef){ ef.style.width = Math.max(0,e.curHp/e.maxHp*100)+'%'; ef.className='fill '+hpClass(e); }
  const ph = document.querySelector('#f-player .hp'); if(ph) ph.textContent = Math.max(0,p.curHp)+' / '+p.maxHp;
  const eh = document.querySelector('#f-enemy .hp'); if(eh) eh.textContent = Math.max(0,e.curHp)+' / '+e.maxHp;
}
function resolveBattleStep(logs){
  updateBars();
  const p = activeP(), e = activeE();
  let msg = logs.join(' ');
  if(e.fainted){
    if(BATTLE.eIdx < BATTLE.enemyTeam.length-1){
      BATTLE.eIdx++;
      msg += ` 상대가 ${activeE().sp.name}을(를) 내보냈다!`;
      BATTLE.locked = false;
      renderBattle(msg);
      return;
    } else {
      finishBattle(true);
      return;
    }
  }
  if(p.fainted){
    const alive = BATTLE.playerTeam.map((f,i)=>({f,i})).filter(x=>!x.f.fainted);
    if(alive.length===0){ finishBattle(false); return; }
    if(alive.length===1){
      BATTLE.pIdx = alive[0].i;
      msg += ` ${activeP().sp.name}을(를) 내보냈다!`;
      BATTLE.locked = false;
      renderBattle(msg);
      return;
    }
    BATTLE.pick = 'forced';
    BATTLE.locked = false;
    renderBattle(msg + ' 다음에 내보낼 스피릿몬을 고르세요');
    return;
  }
  BATTLE.locked = false;
  if(BATTLE.pick) BATTLE.pick = null;
  renderBattleLogOnly(msg);
}
function finishBattle(playerWon){
  BATTLE.finished = true;
  if(BATTLE.mode==='rank'){
    if(playerWon){
      STATE.lp += 20; STATE.wins++;
      const t = tierForLP(STATE.lp);
      if(TIERS.findIndex(x=>x.key===t.key) > TIERS.findIndex(x=>x.key===STATE.seasonBestTier)) STATE.seasonBestTier = t.key;
      sfxVictory();
    } else {
      STATE.lp = Math.max(0, STATE.lp-12); STATE.losses++;
      sfxDefeat();
    }
    STATE.gems += playerWon? 60: 20;
    saveState();
  }
  const raidHtml = BATTLE.mode==='raid' ? raidFinish(playerWon) : '';
  const el = document.getElementById('screen-battle');
  el.innerHTML += `<div class="card center" style="margin-top:10px;">
    <div style="font-size:36px;">${playerWon?'🏆':'💀'}</div>
    <h3>${playerWon?'승리!':'패배...'}</h3>
    ${BATTLE.mode==='rank'?`<div class="subtle">${playerWon?'+20 LP · +60 젬':'-12 LP · +20 젬'}</div>`:''}
    ${raidHtml}
    <div style="height:10px;"></div>
    <div class="btn gold block" onclick="exitBattle()" aria-label="배틀 결과 확인하고 돌아가기">확인</div>
  </div>`;
}
function fleeBattle(){
  if(!BATTLE || BATTLE.finished){ exitBattle(); return; }
  if(BATTLE.mode==='rank'){ STATE.lp = Math.max(0, STATE.lp-12); STATE.losses++; saveState(); }
  exitBattle();
}
function exitBattle(){
  const wasRaid = BATTLE && BATTLE.mode==='raid';
  BATTLE = null;
  goScreen(wasRaid ? 'raid' : (STATE.party.length?'rank':'party'));
}

function startRaid(tierId){
  if(STATE.party.length===0){ toast('파티를 먼저 편성하세요!'); goScreen('party'); return; }
  if(raidTriesLeft()<=0){ toast('오늘 레이드 도전 횟수를 다 썼어요'); return; }
  const t = RAID_TIERS.find(x=>x.id===tierId); if(!t) return;
  STATE.raidTries = (STATE.raidTries||0) + 1; saveState();
  const els = Object.keys(LINES);
  const el = els[Math.floor(Math.random()*els.length)];
  const inst = { uid:'boss_'+Date.now(), speciesId: el+'_'+t.stageIdx, level:1, boost:0, mulBonus:t.mulBonus, hpMul:t.hpMul };
  const playerTeam = STATE.party.map(uid=>buildFighter(uid, false));
  BATTLE = { mode:'raid', raidTier:t.id, raidName:t.name, playerTeam, enemyTeam:[buildFighter(inst, true)], pIdx:0, eIdx:0, log:[], finished:false, locked:false };
  goScreen('battle');
  renderBattle('🐲 레이드 보스 '+speciesById(inst.speciesId).name+' 출현!');
}
function raidFinish(won){
  const t = RAID_TIERS.find(x=>x.id===BATTLE.raidTier);
  if(!won){
    STATE.gems += 15; sfxDefeat(); saveState();
    return '<div class="subtle">보스를 쓰러뜨리지 못했어요 · 위로금 💎15</div>';
  }
  sfxVictory();
  const r = t.reward, lines = [];
  STATE.gems += r.gems; lines.push('💎 '+r.gems);
  STATE.shards += r.shards; lines.push('🔶 '+r.shards);
  let tk = r.tickets||0;
  if(r.ticketChance && Math.random()<r.ticketChance) tk += 1;
  if(tk){ STATE.tickets += tk; lines.push('🎫 소환권 '+tk+'장'); }
  if(r.limitedChance && Math.random()<r.limitedChance){
    const id = PICKUP.ids[Math.floor(Math.random()*PICKUP.ids.length)];
    const g = grantSpecies(id);
    lines.push(g.dup
      ? '✨ 한정 몬스터 '+g.sp.name+' (중복 · 강화 +'+g.boost+', 조각 +'+g.shardGain+')'
      : '✨ 한정 몬스터 '+g.sp.name+' 획득!');
    sfxMega();
  }
  // 🌟 레이드 전용 몬스터
  const ex = RAID_EXCLUSIVE[t.id];
  STATE.raidPity = STATE.raidPity || {};
  STATE.raidPity[t.id] = (STATE.raidPity[t.id]||0) + 1;
  if(STATE.raidPity[t.id]>=ex.pity || Math.random()<ex.chance){
    STATE.raidPity[t.id] = 0;
    const g = grantSpecies(ex.id);
    lines.push(g.dup
      ? '🌟 레이드 전용 '+g.sp.name+' (중복 · 강화 +'+g.boost+', 조각 +'+g.shardGain+')'
      : '🌟 레이드 전용 몬스터 '+g.sp.name+' 획득!');
    sfxMega();
  }
  STATE.raidClears = STATE.raidClears || {};
  STATE.raidClears[t.id] = (STATE.raidClears[t.id]||0) + 1;
  saveState();
  return '<div class="subtle">'+t.name+' 클리어! 보상</div><div style="margin-top:4px;line-height:1.7;">'+lines.join('<br>')+'</div>';
}

function hostFriendRoom(){
  const code = Math.random().toString(36).substring(2,8).toUpperCase();
  FRIEND = {status:'connecting', roomCode:code, isHost:true};
  renderFriend();
  try{
    const peer = new Peer('spmon-'+code);
    FRIEND.peer = peer;
    peer.on('open', ()=>{});
    peer.on('connection', (conn)=>{
      FRIEND.conn = conn;
      setupFriendConn();
    });
    peer.on('error', (err)=>{ toast('연결 오류: '+err.type); leaveFriend(); });
  }catch(e){ toast('친구 대전을 사용할 수 없어요 (네트워크 확인)'); leaveFriend(); }
}
function joinFriendRoom(){
  const codeInput = document.getElementById('friend-code-input');
  const code = (codeInput.value||'').trim().toUpperCase();
  if(!code){ toast('코드를 입력하세요'); return; }
  FRIEND = {status:'connecting', roomCode:null, isHost:false};
  renderFriend();
  try{
    const peer = new Peer();
    FRIEND.peer = peer;
    peer.on('open', ()=>{
      const conn = peer.connect('spmon-'+code, {reliable:true});
      FRIEND.conn = conn;
      setupFriendConn();
    });
    peer.on('error', (err)=>{ toast('연결 오류: '+err.type); leaveFriend(); });
  }catch(e){ toast('친구 대전을 사용할 수 없어요 (네트워크 확인)'); leaveFriend(); }
}
function setupFriendConn(){
  const conn = FRIEND.conn;
  conn.on('open', ()=>{
    FRIEND.status='select';
    toast('연결 성공!');
    renderFriend();
  });
  conn.on('data', (data)=>handleFriendData(data));
  conn.on('close', ()=>{ toast('연결이 끊어졌어요'); leaveFriend(); });
}
/* ===== 근처 기기 대전: 서버 없이 기기끼리 직접 연결 (WebRTC + 코드 교환) ===== */
function b64urlEncode(bytes){ let s=''; for(const b of bytes) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64urlDecode(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const bin=atob(str); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
/* --- 코드 압축: 연결에 꼭 필요한 값만 뽑아 바이너리로 담아요 (약 110자) --- */
function sdpToCompact(sdp, type){
  const get = (re)=>{ const m = sdp.match(re); return m ? m[1] : null; };
  const ufrag = get(/a=ice-ufrag:(\S+)/), pwd = get(/a=ice-pwd:(\S+)/), fp = get(/a=fingerprint:sha-256 ([0-9A-Fa-f:]+)/);
  if(!ufrag || !pwd || !fp) return null;
  if(!/^[\x21-\x7e]{1,255}$/.test(ufrag) || !/^[\x21-\x7e]{1,255}$/.test(pwd)) return null;
  const fpBytes = fp.split(':').map(h=>parseInt(h,16));
  if(fpBytes.length!==32 || fpBytes.some(isNaN)) return null;
  const cands = [];
  const re = /a=candidate:\S+ 1 udp \d+ (\S+) (\d+) typ host/g; let m;
  while((m = re.exec(sdp)) && cands.length<3){
    const host = m[1], port = +m[2];
    const v4 = host.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
    const md = host.match(/^([0-9a-fA-F]{8})-([0-9a-fA-F]{4})-([0-9a-fA-F]{4})-([0-9a-fA-F]{4})-([0-9a-fA-F]{12})\.local$/);
    if(v4) cands.push([1, v4.slice(1).map(Number), port]);
    else if(md){ const hex = md.slice(1).join(''); const bs = []; for(let i=0;i<16;i++) bs.push(parseInt(hex.substr(i*2,2),16)); cands.push([2, bs, port]); }
  }
  if(!cands.length) return null;
  const u = [type==='o' ? 1 : 2];
  const pushStr = (s)=>{ u.push(s.length); for(let i=0;i<s.length;i++) u.push(s.charCodeAt(i)); };
  pushStr(ufrag); pushStr(pwd);
  fpBytes.forEach(x=>u.push(x));
  u.push(cands.length);
  cands.forEach(([k, bs, port])=>{ u.push(k); bs.forEach(x=>u.push(x)); u.push(port>>8, port&255); });
  return new Uint8Array(u);
}
function compactToSdp(bytes){
  let i = 0;
  const type = bytes[i++]===1 ? 'o' : 'a';
  const readStr = ()=>{ const n = bytes[i++]; let s = ''; for(let k=0;k<n;k++) s += String.fromCharCode(bytes[i++]); return s; };
  const ufrag = readStr(), pwd = readStr();
  const fp = []; for(let k=0;k<32;k++) fp.push(bytes[i++].toString(16).toUpperCase().padStart(2,'0'));
  const n = bytes[i++], cands = [];
  for(let k=0;k<n;k++){
    const kind = bytes[i++]; let host;
    if(kind===1){ host = [bytes[i],bytes[i+1],bytes[i+2],bytes[i+3]].join('.'); i += 4; }
    else{
      let hex = ''; for(let j=0;j<16;j++) hex += bytes[i+j].toString(16).padStart(2,'0'); i += 16;
      host = hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20)+'.local';
    }
    const port = (bytes[i]<<8) | bytes[i+1]; i += 2;
    cands.push({host, port});
  }
  const sdp = ['v=0','o=- 0 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE 0',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0',
    'a=ice-ufrag:'+ufrag,'a=ice-pwd:'+pwd,'a=fingerprint:sha-256 '+fp.join(':'),
    'a=setup:'+(type==='o' ? 'actpass' : 'active'),'a=mid:0','a=sctp-port:5000','a=max-message-size:262144']
    .concat(cands.map((c,k)=>'a=candidate:'+(k+1)+' 1 udp '+(2113937151-k)+' '+c.host+' '+c.port+' typ host'))
    .join('\r\n') + '\r\n';
  return {t:type, s:sdp};
}
async function packCode(obj){
  const compact = sdpToCompact(obj.s, obj.t);
  if(compact) return 'S2.' + b64urlEncode(compact);
  // 예외적인 환경: 예전 방식(전체 SDP 압축)으로 대체
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=='undefined'){
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'SPM1.' + b64urlEncode(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  return 'SPM0.' + b64urlEncode(bytes);
}
async function unpackCode(text){
  const t = (text||'').replace(/\s+/g,'');
  const legacy = t.match(/SPM([01])\.([A-Za-z0-9_-]+)/);
  if(legacy){
    let bytes = b64urlDecode(legacy[2]);
    if(legacy[1]==='1'){
      if(typeof DecompressionStream==='undefined') throw new Error('no decompress');
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  const m = t.match(/S2\.([A-Za-z0-9_-]+)/);
  if(!m) throw new Error('bad code');
  return compactToSdp(b64urlDecode(m[1]));
}
function waitIce(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    let tm = null;
    const done = ()=>{ pc.removeEventListener('icegatheringstatechange', chk); clearTimeout(tm); res(); };
    const chk = ()=>{ if(pc.iceGatheringState==='complete') done(); };
    pc.addEventListener('icegatheringstatechange', chk);
    tm = setTimeout(done, 3000);
  });
}
// PeerJS 연결 객체와 같은 모양(on/send/close/open)으로 감싸서 기존 대전 코드를 그대로 사용
function makeLocalConn(dc){
  const handlers = {};
  const conn = {
    open:false,
    on(ev, cb){ handlers[ev] = cb; },
    send(o){ if(dc.readyState==='open') dc.send(JSON.stringify(o)); },
    close(){ try{ dc.close(); }catch(e){} },
    _start(){
      dc.onopen = ()=>{ conn.open = true; handlers.open && handlers.open(); };
      dc.onmessage = (e)=>{ try{ handlers.data && handlers.data(JSON.parse(e.data)); }catch(err){} };
      dc.onclose = ()=>{ conn.open = false; handlers.close && handlers.close(); };
      if(dc.readyState==='open') dc.onopen();
    }
  };
  return conn;
}
function watchLocalConnect(f){

  f.pc = pc;
  f.peer = {destroy(){ try{ pc.close(); }catch(e){} }};
  pc.oniceconnectionstatechange = ()=>{
    if(pc.iceConnectionState==='failed' && FRIEND===f && f.status.indexOf('local-')===0) toast('연결에 실패했어요. 같은 와이파이/핫스팟인지 확인하고 다시 시도해 주세요');

  return pc;
}

  } else if(data.type==='move'){

    tryResolveFriendTurn();
  } else if(data.type==='result'){

    FRIEND.myHp = data.yourHp; FRIEND.oppHp = data.oppHp; FRIEND.log = data.log;

function tryResolveFriendTurn(){
  if(!FRIEND.isHost) return;
  if(FRIEND.myMoveIdx===undefined || FRIEND.oppMoveIdx===undefined) return;
  const myMoves = movesForSpecies(FRIEND.myMon.sp);
  const move1 = myMoves[FRIEND.myMoveIdx];
  const oppSpLike = {element: FRIEND.oppMon.element, stats: FRIEND.oppMon.stats};
  const oppMoves = FRIEND.oppMon.moves || [{name:'몸통박치기',type:'neutral',power:35},{name:FLAVOR[FRIEND.oppMon.element].basic,type:FRIEND.oppMon.element,power:45},{name:FLAVOR[FRIEND.oppMon.element].basic+'X',type:FRIEND.oppMon.element,power:60},{name:FLAVOR[FRIEND.oppMon.element].ult,type:FRIEND.oppMon.element,power:80}];
  const move2 = oppMoves[FRIEND.oppMoveIdx] || oppMoves[0];
  const mySpd = FRIEND.myMon.sp.stats.spd, oppSpd = FRIEND.oppMon.stats.spd;
  const iGoFirst = mySpd>=oppSpd;
  function dmgCalc(atkStats, defStats, move, defElement){
    const mult = typeMult(move.type, defElement);
    const variance = 0.85+Math.random()*0.3;
    if(mult===0) return 0;
    return Math.max(3, Math.round(move.power*(atkStats.atk/Math.max(8,defStats.def))*0.9*mult*variance));
  }
  let myHp=FRIEND.myHp, oppHp=FRIEND.oppHp, logs=[];
  if(iGoFirst){
    const d1=dmgCalc(FRIEND.myMon.sp.stats, FRIEND.oppMon.stats, move1, FRIEND.oppMon.element);
    oppHp-=d1; logs.push(`${FRIEND.myMon.sp.name}의 ${move1.name}! ${d1} 피해${effText(typeMult(move1.type, FRIEND.oppMon.element))}`);
    if(oppHp>0){ const d2=dmgCalc(FRIEND.oppMon.stats, FRIEND.myMon.sp.stats, move2, FRIEND.myMon.sp.element); myHp-=d2; logs.push(`${FRIEND.oppMon.name}의 ${move2.name}! ${d2} 피해${effText(typeMult(move2.type, FRIEND.myMon.sp.element))}`); }
  } else {
    const d2=dmgCalc(FRIEND.oppMon.stats, FRIEND.myMon.sp.stats, move2, FRIEND.myMon.sp.element);
    myHp-=d2; logs.push(`${FRIEND.oppMon.name}의 ${move2.name}! ${d2} 피해${effText(typeMult(move2.type, FRIEND.myMon.sp.element))}`);
    if(myHp>0){ const d1=dmgCalc(FRIEND.myMon.sp.stats, FRIEND.oppMon.stats, move1, FRIEND.oppMon.element); oppHp-=d1; logs.push(`${FRIEND.myMon.sp.name}의 ${move1.name}! ${d1} 피해${effText(typeMult(move1.type, FRIEND.oppMon.element))}`); }
  }
  FRIEND.myHp=myHp; FRIEND.oppHp=oppHp; FRIEND.log=logs.join(' ');
  FRIEND.myMoveChosen=false; FRIEND.myMoveIdx=undefined; FRIEND.oppMoveIdx=undefined;
  sendFriend({type:'result', yourHp:oppHp, oppHp:myHp, log:logs.join(' ')}); // 상대 입장에서 반전
  renderFriend();
  setTimeout(()=>{ spawnParticles('player'); spawnParticles('enemy'); }, 50);
  checkFriendEnd();
}

async function decodeSaveCode(text){

  let o;
  try{ o = await decodeSaveCode(document.getElementById('save-import').value); }
  catch(e){ toast('저장 코드가 올바르지 않아요'); return; }
  PENDING_SAVE = o;
  showModal(`<div class="center"><h3>저장 코드로 덮어쓸까요?</h3>
    <div class="subtle" style="margin:8px 0;line-height:1.7;">불러올 데이터: 스피릿몬 ${o.owned.length}마리 · 💎 ${o.gems||0} · 🔶 ${o.shards||0}<br>지금 진행 중인 데이터는 백업으로 보관돼요.</div>
    <div class="grid2">
      <div class="btn gold block" onclick="confirmImportSave()" aria-label="덮어쓰고 불러오기">덮어쓰기</div>
      <div class="btn ghost block" onclick="PENDING_SAVE=null;openSaveManager()" aria-label="취소">취소</div>
    </div></div>`);
}
function confirmImportSave(){
  if(!PENDING_SAVE) return;
  lsSet(SAVE_BAK, JSON.stringify(STATE)); lastBackupAt = Date.now();
  STATE = Object.assign(defaultState(), PENDING_SAVE); PENDING_SAVE = null;
  saveState(); refreshRes(); closeModal(); goScreen('home'); renderHome();
  toast('✅ 불러오기 완료!');
}

async function init(){
  await loadState();
  startAutosave();
  refreshRes();
  renderHome();
  document.body.addEventListener('touchstart', function unlock(){
    ensureAudio(); startBgm();
    document.body.removeEventListener('touchstart', unlock);
  }, {once:true});
  document.body.addEventListener('click', function unlockc(){
    ensureAudio(); startBgm();
    document.body.removeEventListener('click', unlockc);
  }, {once:true});
}
/* ============ 접근성: 남은 버튼 자동 라벨 + 키보드 조작 ============ */
const EMOJI_RE = /[\p{Extended_Pictographic}\uFE0F\u200D]/gu;
function a11yScan(){
  document.querySelectorAll('[onclick], .btn, .movebtn, .navbtn').forEach(el=>{
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('aria-label')){
      const t = (el.innerText||el.textContent||'').replace(EMOJI_RE,'').replace(/\s*\n\s*/g,', ').replace(/\s+/g,' ').trim();
      if(t) el.setAttribute('aria-label', t);
    }
  });
}
let a11yQueued = false;
new MutationObserver(()=>{
  if(a11yQueued) return; a11yQueued = true;
  requestAnimationFrame(()=>{ a11yQueued = false; a11yScan(); });
}).observe(document.body, {childList:true, subtree:true});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  const t = e.target;
  if((e.key==='Enter' || e.key===' ') && t && t.getAttribute && t.getAttribute('role')==='button'){
    e.preventDefault(); t.click();
  }
});
a11yScan();

init();
</script>
