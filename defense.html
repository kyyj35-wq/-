<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noai, noimageai">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="tdm-reservation" content="1">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>운빨 스피릿 디펜스 (Lucky Spirit Defense)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0914; --panel:#141224; --panel-border:#322a52;
  --gold:#ffd166; --gold-dark:#b38a2e; --cyan:#3ac6ff;
  --fire:#ff5e4d; --electric:#ffdf40; --shadow:#b580ff;
  --text:#f3efff; --text-muted:#9b92b8; --danger:#ff4f6a; --success:#4ade80;
  --tier-common:#9ca3af; --tier-rare:#38bdf8; --tier-epic:#a855f7; --tier-legend:#eab308; --tier-mythic:#ef4444;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; user-select:none;}
html,body{height:100%; background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; overscroll-behavior:none;}
#app{position:fixed; inset:0; display:flex; flex-direction:column; background:radial-gradient(circle at 50% 20%, #1e1738 0%, #0a0914 80%); overflow:hidden;}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;}

/* Header */
header{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#120f21ee; border-bottom:1px solid var(--panel-border); z-index:10;}
.logo{font-family:'Cinzel',serif; font-weight:900; font-size:17px; color:var(--gold); display:flex; align-items:center; gap:6px;}
.stats-bar{display:flex; gap:8px; font-size:12px; font-weight:700;}
.stat-tag{background:#00000066; border:1px solid var(--panel-border); border-radius:14px; padding:4px 8px; display:flex; align-items:center; gap:4px;}

/* Main Area */
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px; display:flex; flex-direction:column; gap:12px;}

/* Monster Wave Tracker */
.wave-banner{background:linear-gradient(90deg, #1d1736, #2d1c47); border:1px solid var(--panel-border); border-radius:14px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center;}
.monster-meter{display:flex; align-items:center; gap:8px;}
.meter-bar{width:80px; height:8px; background:#000; border-radius:4px; overflow:hidden;}
.meter-fill{height:100%; background:var(--success); transition:width 0.3s;}
.meter-fill.danger{background:var(--danger);}

/* Summon Field (4x4 Grid) */
.field-container{background:#0d0b1a; border:2px solid var(--panel-border); border-radius:16px; padding:8px; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; aspect-ratio:1/1; max-width:380px; margin:0 auto; width:100%; box-shadow:0 8px 30px #00000088;}
.field-slot{background:#17132a; border:1px solid #ffffff11; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:transform 0.1s, border-color 0.1s;}
.field-slot:active{transform:scale(0.95);}
.field-slot.has-unit{border-width:2px;}
.field-slot.common{border-color:var(--tier-common); background:#201c38;}
.field-slot.rare{border-color:var(--tier-rare); background:#152840; box-shadow:inset 0 0 8px #38bdf833;}
.field-slot.epic{border-color:var(--tier-epic); background:#271644; box-shadow:inset 0 0 10px #a855f744;}
.field-slot.legend{border-color:var(--tier-legend); background:#332612; box-shadow:0 0 12px #eab30866;}
.field-slot.mythic{border-color:var(--tier-mythic); background:#3d141e; box-shadow:0 0 16px #ef4444aa; animation:pulse 1.5s infinite;}

@keyframes pulse { 0%{box-shadow:0 0 10px #ef4444aa;} 50%{box-shadow:0 0 20px #ef4444ff;} 100%{box-shadow:0 0 10px #ef4444aa;} }

.unit-emoji{font-size:26px;}
.unit-tier{font-size:9px; font-weight:800; border-radius:4px; padding:1px 4px; margin-top:2px; text-transform:uppercase;}
.tier-common{color:var(--tier-common); background:#ffffff11;}
.tier-rare{color:var(--tier-rare); background:#38bdf822;}
.tier-epic{color:var(--tier-epic); background:#a855f722;}
.tier-legend{color:var(--tier-legend); background:#eab30822;}
.tier-mythic{color:var(--tier-mythic); background:#ef444433;}

/* Action Controls */
.controls-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:380px; margin:0 auto; width:100%;}
.btn{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; border-radius:14px; font-weight:800; font-size:14px; border:1px solid var(--panel-border); background:linear-gradient(180deg, #2b234d, #1a1533); color:var(--text); cursor:pointer;}
.btn:active{transform:scale(0.97);}
.btn-gold{background:linear-gradient(180deg, #ffe082, #e0a430); color:#221500; border-color:#d49b29;}
.btn-cyan{background:linear-gradient(180deg, #5fe4ff, #1795c4); color:#002233; border-color:#1482ab;}
.btn-sub{font-size:10px; opacity:0.8; font-weight:500; margin-top:2px;}

/* Battle Log */
.battle-log{background:#0a0814; border:1px solid var(--panel-border); border-radius:12px; padding:10px 14px; min-height:48px; max-height:70px; overflow-y:auto; font-size:12px; line-height:1.4; color:var(--text-muted); max-width:380px; margin:0 auto; width:100%;}
.battle-log strong{color:var(--gold);}
.battle-log .danger{color:var(--danger); font-weight:700;}
.battle-log .jackpot{color:var(--tier-mythic); font-weight:900;}
  .tier-transcend{ background:linear-gradient(135deg,#fff7cc,#ffb3f0,#b3ecff); color:#4a0080; text-shadow:0 0 6px #fff; box-shadow:0 0 14px #ffe6ff; animation:transcendPulse 1.6s infinite; }
  @keyframes transcendPulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.35); } }
  .field-slot.has-unit.transcend{ border-color:#ff9ff3; box-shadow:0 0 16px #ff9ff388, inset 0 0 20px #fff7cc33; }
  #artifact-book{ position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; z-index:999; }
  .artifact-book-inner{ background:#141428; border:1px solid var(--gold); border-radius:14px; padding:18px; width:min(520px, 92vw); color:var(--text); }
  .artifact-book-inner h3{ margin:0 0 12px; color:var(--gold); }
  .artifact-row{ display:flex; gap:8px; align-items:baseline; padding:7px 4px; border-bottom:1px solid #ffffff14; font-size:13px; }
  .artifact-row .artifact-emoji{ width:26px; text-align:center; }
  .artifact-row .artifact-name{ font-weight:800; min-width:110px; }
  .artifact-row:not(.owned){ opacity:.45; }
  .artifact-row .artifact-desc{ font-size:11px; color:var(--text-muted); flex:1; }
  .diff-btn{ font-size:11px; padding:5px 10px; border-radius:8px; border:1px solid var(--gold); background:transparent; color:var(--gold); cursor:pointer; font-weight:800; }
  .diff-btn.active{ background:var(--gold); color:#141428; }
  .btn-crimson{ background:linear-gradient(135deg,#5a00a0,#c4009f); color:#fff; }
</style>
  <script src="spirit-core.js"></script>
</head>
<body>
<div id="app">
  <div id="sr-announcer" class="sr-only" aria-live="assertive" aria-atomic="true">운빨 스피릿 디펜스 준비 완료.</div>

  <!-- Header -->
  <header>
    <div class="logo"><span>🎲</span> LUCKY SPIRIT</div>
    <div class="stats-bar">
      <div class="stat-tag" title="소지 골드"><span>🪙</span> <span id="val-coins">100</span></div>
      <div class="stat-tag" title="공격력 레벨"><span>⚔️</span> Lv.<span id="val-atk-lv">1</span></div>
    </div>
  </header>

  <!-- Main View -->
  <main>
    <!-- Wave Info & Monster Limit -->
    <div class="wave-banner">
      <div>
        <div style="font-size:11px; color:var(--text-muted);">CURRENT WAVE</div>
        <div style="font-size:16px; font-weight:900; color:var(--gold);" id="val-wave">Wave 1</div>
      </div>
      <div class="monster-meter">
        <div style="text-align:right;">
          <div style="font-size:10px; color:var(--text-muted);">적 몬스터 한도</div>
          <div style="font-size:12px; font-weight:800;" id="monster-count-text">0 / 60마리</div>
        </div>
        <div class="meter-bar">
          <div class="meter-fill" id="monster-meter-fill" style="width:0%;"></div>
        </div>
      </div>
    </div>

    <!-- Difficulty Selector -->
    <div class="wave-banner" role="group" aria-label="난이도 선택">
      <div style="font-size:11px; color:var(--text-muted);">DIFFICULTY</div>
      <div style="display:flex; gap:6px;">
        <button class="diff-btn active" id="diff-normal" onclick="game.setDifficulty('normal')" aria-label="일반 난이도">일반</button>
        <button class="diff-btn" id="diff-hard" onclick="game.setDifficulty('hard')" aria-label="하드 난이도">🔥 하드</button>
        <button class="diff-btn" id="diff-hell" onclick="game.setDifficulty('hell')" aria-label="지옥 난이도">💀 지옥</button>
        <button class="diff-btn" onclick="game.showArtifacts()" aria-label="유물 도감 열기">🏺 유물 도감</button>
      </div>
    </div>

    <!-- 4x4 Field -->
    <div class="field-container" id="grid-field">
      <!-- 16 slots rendered by JS -->
    </div>

    <!-- Controls -->
    <div class="controls-grid">
      <button class="btn btn-gold" id="btn-summon" onclick="game.summon()">
        <span>🎲 정령 소환 (Space/1)</span>
        <span class="btn-sub" id="summon-cost-text">코인 10개</span>
      </button>

      <button class="btn btn-cyan" id="btn-merge" onclick="game.autoMerge()">
        <span>⚡ 3합성 승급 (M/2)</span>
        <span class="btn-sub">동일 정령 3개 합성</span>
      </button>

      <button class="btn" id="btn-upgrade" onclick="game.upgradeAtk()">
        <span>⚔️ 공격력 강화 (U/3)</span>
        <span class="btn-sub" id="upgrade-cost-text">코인 20개</span>
      </button>

      <button class="btn btn-crimson" id="btn-transcend" onclick="game.transcendFusion()">
        <span>🌌 초월 융합 (T키)</span>
        <span class="btn-sub">신화 2마리 + 공격 Lv.10 이상</span>
      </button>

      <button class="btn" id="btn-status" onclick="game.announceStatus()">
        <span>📊 상태 종합 (C키)</span>
        <span class="btn-sub">보이스오버 낭독</span>
      </button>
    </div>

    <!-- Log -->
    <div class="battle-log" id="battle-log" role="log" aria-live="polite">
      정령을 소환하여 몰려오는 몬스터를 막아내세요! (몬스터가 60마리가 넘으면 패배)
    </div>
  </main>
</div>
