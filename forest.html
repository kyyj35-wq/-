<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(180deg, #aee3f5 0%, #d8f2c8 45%, #f4e6b8 100%);
    min-height: 100vh; color: #3d3325;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 8px; text-align: center; text-shadow: 0 1px 0 #fff; }
  #bellBar { text-align: center; font-size: 18px; margin: 0 0 10px; background: #fff8; border-radius: 12px; padding: 6px; }
  #topBtns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  #btnSpiritLink { background: #fff8e1; border-color: #d19a3c; color: #8c5a00; box-shadow: 0 2px 0 #d19a3c88; font-weight: 800; }
  button {
    font-family: inherit; font-size: 15px; font-weight: 700; color: #3d3325;
    background: #fff; border: 2px solid #c9a86a; border-radius: 14px;
    padding: 10px 12px; cursor: pointer; box-shadow: 0 2px 0 #c9a86a88;
  }
  button { touch-action: manipulation; }
  button:active { transform: translateY(2px); box-shadow: none; }
  button:focus-visible { outline: 3px solid #1d6fd1; outline-offset: 2px; }
  #status, #alert {
    border-radius: 12px; padding: 8px 10px; font-size: 15px; margin: 6px 0; min-height: 20px;
  }
  #status { background: #ffffffd9; }
  #alert { background: #ffe9b3; font-weight: 700; border: 2px solid #e8b93c; }
  #alert:empty { display: none; }
  #map { display: block; margin: 8px auto; border-radius: 16px; border: 4px solid #b98b4e; box-shadow: 0 4px 10px #0003; background: #8fce6f; }
  #dlg {
    background: #fffdf4; border: 3px solid #c9a86a; border-radius: 16px;
    padding: 10px 12px; margin: 8px 0; box-shadow: 0 4px 10px #0002;
  }
  #dlgName { font-weight: 800; color: #0a7d43; margin: 0 0 4px; font-size: 16px; }
  #dlgTyped { margin: 0 0 8px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; min-height: 24px; }
  #dlgChoices { display: flex; flex-direction: column; gap: 6px; }
  #dlgChoices button { text-align: left; }
  #actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; min-height: 10px; }
  #actions button { background: #eaf7dd; border-color: #7fae4e; box-shadow: 0 2px 0 #7fae4e88; }
  #dpad {
    display: grid; grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(3, 60px);
    gap: 6px; justify-content: center; margin: 12px 0 24px;
  }
  .mv { font-size: 24px; background: #fff2cf; border-color: #d19a3c; box-shadow: 0 3px 0 #d19a3c88; }
  .mv.u { grid-area: 1 / 2; } .mv.l { grid-area: 2 / 1; } .mv.r { grid-area: 2 / 3; }
  .mv.d { grid-area: 3 / 2; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

    <button id="btnPouch" type="button" aria-label="주머니 열기">🎒 주머니</button>

  <div id="alert" role="alert" aria-live="assertive"></div>

  <section id="dlg" hidden aria-label="대화 상자">
    <p id="dlgName"></p>
    <p id="dlgLive" class="sr-only" aria-live="assertive"></p>
    <p id="dlgTyped" aria-hidden="true"></p>
    <div id="dlgChoices"></div>

  <div id="dpad" role="group" aria-label="이동 방향 버튼">

  </div>
